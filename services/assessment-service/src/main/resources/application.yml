server:
  port: 8084

spring:
  application:
    name: assessment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/assessment_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL}
    registerWithEureka: true
    fetchRegistry: true
  instance:
    prefer-ip-address: true

app:
  services:
    question-url: ${QUESTION_SERVICE_URL}
    content-url: ${CONTENT_SERVICE_URL}
