server:
  port: 8085

spring:
  application:
    name: adaptive-learning-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/adaptive_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    registerWithEureka: true
    fetchRegistry: true
  instance:
    prefer-ip-address: true

app:
  services:
    assessment-url: ${ASSESSMENT_SERVICE_URL:http://localhost:8084}
    content-url: ${CONTENT_SERVICE_URL:http://localhost:8082}
