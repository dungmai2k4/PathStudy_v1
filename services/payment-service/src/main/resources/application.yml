server:
  port: 8087

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/payment_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    registerWithEureka: true
    fetchRegistry: true
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

vietqr:
  bank-id: ${VIETQR_BANK_ID:TCB}
  account-no: ${VIETQR_ACCOUNT_NO:19070027277011}
  account-name: ${VIETQR_ACCOUNT_NAME:MAI TIEN DUNG}
  template: ${VIETQR_TEMPLATE:compact2}

payment:
  webhook:
    secure-token: ${PAYMENT_WEBHOOK_TOKEN:study_path_secure_webhook_token_2026}
  services:
    auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
