server:
  port: 8087

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/payment_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL}
    registerWithEureka: true
    fetchRegistry: true
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}

vietqr:
  bank-id: ${VIETQR_BANK_ID}
  account-no: ${VIETQR_ACCOUNT_NO}
  account-name: ${VIETQR_ACCOUNT_NAME}
  template: ${VIETQR_TEMPLATE}

payment:
  webhook:
    secure-token: ${PAYMENT_WEBHOOK_TOKEN:study_path_secure_webhook_token_2026}
  services:
    auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
