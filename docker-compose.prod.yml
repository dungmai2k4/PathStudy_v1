services:
  # ========================================================
  # 1. DATABASE: PostgreSQL (Chứa tất cả 6 microservice DBs)
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: pathstudy-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks:
      - pathstudy-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ========================================================
  # 2. SERVICE DISCOVERY: Eureka Server
  # ========================================================
  eureka-server:
    build:
      context: ./infrastructure/eureka-server
    image: pathstudy/eureka-server:latest
    container_name: pathstudy-eureka
    restart: always
    environment:
      JAVA_OPTS: "-XX:+UseSerialGC -Xms64m -Xmx192m -XX:MaxMetaspaceSize=96m"
    networks:
      - pathstudy-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8761/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 256M

  # ========================================================
  # 3. API GATEWAY: Spring Cloud Gateway
  # ========================================================
  api-gateway:
    build:
      context: ./services/api-gateway
    image: pathstudy/api-gateway:latest
    container_name: pathstudy-gateway
    restart: always
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      GATEWAY_PORT: 8088
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      CORS_ALLOWED_ORIGIN_PROD: ${CORS_ALLOWED_ORIGIN_PROD:-*}
      JAVA_OPTS: "-XX:+UseSerialGC -Xms96m -Xmx256m -XX:MaxMetaspaceSize=128m"
    networks:
      - pathstudy-net
    deploy:
      resources:
        limits:
          memory: 384M

  # ========================================================
  # 4. AUTH SERVICE (Port 8081)
  # ========================================================
  auth-service:
    build:
      context: ./services/auth-service
    image: pathstudy/auth-service:latest
    container_name: pathstudy-auth
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JAVA_OPTS: "-XX:+UseSerialGC -Xms96m -Xmx256m -XX:MaxMetaspaceSize=128m"
    networks:
      - pathstudy-net
    deploy:
      resources:
        limits:
          memory: 384M

  # ========================================================
  # 5. CONTENT SERVICE (Port 8082)
  # ========================================================
  content-service:
    build:
      context: ./services/content-service
    image: pathstudy/content-service:latest
    container_name: pathstudy-content
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      JAVA_OPTS: "-XX:+UseSerialGC -Xms96m -Xmx256m -XX:MaxMetaspaceSize=128m"
    networks:
      - pathstudy-net
    deploy:
      resources:
        limits:
          memory: 384M

  # ========================================================
  # 6. QUESTION SERVICE (Port 8083)
  # ========================================================
  question-service:
    build:
      context: ./services/question-service
    image: pathstudy/question-service:latest
    container_name: pathstudy-question
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      JAVA_OPTS: "-XX:+UseSerialGC -Xms96m -Xmx256m -XX:MaxMetaspaceSize=128m"
    networks:
      - pathstudy-net
    deploy:
      resources:
        limits:
          memory: 384M

  # ========================================================
  # 7. ASSESSMENT SERVICE (Port 8084)
  # ========================================================
  assessment-service:
    build:
      context: ./services/assessment-service
    image: pathstudy/assessment-service:latest
    container_name: pathstudy-assessment
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      QUESTION_SERVICE_URL: http://question-service:8083
      CONTENT_SERVICE_URL: http://content-service:8082
      JAVA_OPTS: "-XX:+UseSerialGC -Xms96m -Xmx256m -XX:MaxMetaspaceSize=128m"
    networks:
      - pathstudy-net
    deploy:
      resources:
        limits:
          memory: 384M

  # ========================================================
  # 8. ADAPTIVE LEARNING SERVICE (Port 8085)
  # ========================================================
  adaptive-learning-service:
    build:
      context: ./services/adaptive-learning-service
    image: pathstudy/adaptive-learning-service:latest
    container_name: pathstudy-adaptive
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      ASSESSMENT_SERVICE_URL: http://assessment-service:8084
      CONTENT_SERVICE_URL: http://content-service:8082
      JAVA_OPTS: "-XX:+UseSerialGC -Xms96m -Xmx256m -XX:MaxMetaspaceSize=128m"
    networks:
      - pathstudy-net
    deploy:
      resources:
        limits:
          memory: 384M

  # ========================================================
  # 9. PAYMENT SERVICE (Port 8087)
  # ========================================================
  payment-service:
    build:
      context: ./services/payment-service
    image: pathstudy/payment-service:latest
    container_name: pathstudy-payment
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      VIETQR_BANK_ID: ${VIETQR_BANK_ID}
      VIETQR_ACCOUNT_NO: ${VIETQR_ACCOUNT_NO}
      VIETQR_ACCOUNT_NAME: ${VIETQR_ACCOUNT_NAME}
      VIETQR_TEMPLATE: ${VIETQR_TEMPLATE:-compact2}
      PAYMENT_WEBHOOK_TOKEN: ${PAYMENT_WEBHOOK_TOKEN}
      AUTH_SERVICE_URL: http://auth-service:8081
      JAVA_OPTS: "-XX:+UseSerialGC -Xms96m -Xmx256m -XX:MaxMetaspaceSize=128m"
    networks:
      - pathstudy-net
    deploy:
      resources:
        limits:
          memory: 384M

  # ========================================================
  # 10. FRONTEND WEB & NGINX PROXY (Port 80 & 443)
  # ========================================================
  frontend:
    build:
      context: ./frontend
    image: pathstudy/frontend:latest
    container_name: pathstudy-web
    restart: always
    depends_on:
      - api-gateway
    ports:
      - "80:80"
    networks:
      - pathstudy-net
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
    driver: local

networks:
  pathstudy-net:
    driver: bridge
